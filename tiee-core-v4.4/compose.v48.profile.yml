services:
  postgres:
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, track_io_timing=on]
  gateway:
    environment:
      PGAPPNAME: gateway
  relay:
    environment:
      PGAPPNAME: relay
  worker:
    environment:
      PGAPPNAME: worker
  probe:
    environment:
      PGAPPNAME: probe
